state_models:   # três vocabulários coexistem (CNF-003); cada um tem escopo próprio
  registry_status: {values: [proposed, active, deprecated, archived], scope: entidades do registry}
  official_states:
    values: [NAO_INICIADO, PREPARADO, EM_EXECUCAO, BLOQUEADO, SUBMETIDO, APROVADO, LIBERADO, VERIFICADO, CONCLUIDO]
    scope: trabalho e entregas (Sessão B)
    completion_rule: execução + resultado esperado + verificação + evidência
    source_refs: [SRC-04]
  implementation_states:
    values: [IDENTIFICADO, PRE_PREENCHIDO, ESPECIFICADO, APROVADO, EM_DESENVOLVIMENTO, IMPLEMENTADO, TESTADO, VERIFICADO, LIBERADO, PUBLICADO]
    scope: documentos canônicos (documents.yaml)
    rule: Nunca promover o estado apenas porque existe um arquivo ou texto.
    source_refs: [SRC-03]
  approval_status: {values: [PENDENTE, APROVADO, REJEITADO], note: "REJEITADO é PROPOSED (não está nas fontes)"}
  state_control:
    - Documento encontrado != documento completo
    - Documento completo != aprovado
    - Código encontrado != implementado
    - Deploy encontrado != verificado
    - Asset encontrado != publicado
    - Decisão proposta != decisão aprovada
    - Plano != resultado executado
    - Arquivo criado != entrega concluída

epistemic_model:  # SRC-03
  classes: [DIRECT, DERIVED, EXTERNAL_EVIDENCE, PROPOSED, GAP, CONFLICT, HYPOTHESIS]
  field_status: [FOUND, DERIVED, EXTERNAL, CONFLICT, NOT_FOUND]
  confidence: [alta, media, baixa, n/a]
  derivation_requirements: [mínimo de duas evidências compatíveis, nenhum novo requisito introduzido, classe DERIVED, justificativa explícita]
  proposal_rule: A resposta canônica permanece TBD; sugestão vai em proposed_value.
  field_contract: [field_id, label, value, normalized_value, evidence_status, epistemic_class, confidence, evidence, conflicts, derived_from, proposed_value, proposed_rationale, notes]
  source_precedence:
    - Fonte original ou documento canônico mais recente
    - Documento macro/especializado da própria área
    - Registros extraídos da área
    - Documentos de áreas relacionadas
    - Inferência formal explicitamente marcada DERIVED
  external_research: Pode complementar requisitos legais técnicos científicos ou de mercado; nunca substitui evidência interna sobre decisão estado owner orçamento implementação ou aprovação.
  sensitive_values: Não reproduzir senhas tokens chaves ou segredos; registrar apenas existência e localização segura.

risk_issue_block:  # SRC-04 — não misturar
  risco: Algo que pode ocorrer
  problema: Algo que já está ocorrendo
  bloqueio: Algo que impede a continuação de uma atividade

change_management: [proposta, avaliador, impacto, decisao, atualizacao_documental, evidencia]  # SRC-04

