conflicts:
  - id: CNF-001
    issue: Numeração de domínios divergente dentro de SRC-01 (tabela macroárea→domínios usa D0, D13 Engenharia … D24 Blueprints; Master Index do mesmo documento e SRC-03 usam D01–D23 canônico).
    source_a: {source: SRC-01 Master Index / SRC-03, value: D01–D23 canônico}
    source_b: {source: SRC-01 tabela de macroáreas, value: numeração deslocada}
    impact: Referências antigas podem apontar para o domínio errado.
    resolution_rule: Canônico D01–D23 prevalece (maior autoridade e mais recente); antigos mapeados em id_migrations.
    requires_human_decision: true
    status: proposed
  - id: CNF-002
    issue: Nomes de macroáreas com variantes entre fontes (ex. A03 "Handoff Produto → Engenharia" × "Handoff e Preparação para Desenvolvimento").
    impact: Baixo — IDs estáveis; nomes alternativos guardados em aliases.
    resolution_rule: Manter name do commit 718d21b; demais variantes em aliases.
    requires_human_decision: true
    status: proposed
  - id: CNF-003
    issue: Três vocabulários de estado (registry, estados oficiais SRC-04, implementation_states SRC-03).
    resolution_rule: Coexistem com escopos distintos (state_models).
    requires_human_decision: true
    status: proposed
  - id: CNF-004
    issue: Marcador de lacuna TBD (SRC-02) × A DEFINIR (SRC-04) × A_DEFINIR (SRC-03).
    resolution_rule: Registry usa TBD; renderização humana PT-BR pode exibir "A DEFINIR" (DEC-001).
    requires_human_decision: false
    status: proposed
  - id: CNF-005
    issue: Workbook dividido em 3 partes (SRC-01/SRC-02) × 17 partes (SRC-04).
    resolution_rule: As 17 partes de SRC-04 são mapeadas dentro das 3 partes (workbook_manual.yaml).
    requires_human_decision: false
    status: proposed
  - id: CNF-006
    issue: Hierarquia documental de SRC-03 (ECOSSISTEMA → ÁREA → DOC MACRO → DOC ESPECIALIZADO → WORKFLOW → ENTREGÁVEL → TAREFA → AÇÃO → EVIDÊNCIA → REGISTRO) × hierarquia funcional (… → PROCESSO → ENTREGÁVEL → ARTEFATO).
    resolution_rule: Funcional na Sessão A; WORKFLOW/TAREFA/AÇÃO pertencem à Sessão B; documentos ficam no nível ARTEFATO.
    requires_human_decision: false
    status: proposed
  - id: CNF-007
    issue: Regra de commit — AGENTS.md (commit direto em main) × instrução da sessão de automação (branch dedicada + PR).
    resolution_rule: Esta mudança seguiu branch + PR draft; regra permanente fica para decisão humana.
    requires_human_decision: true
    status: proposed

