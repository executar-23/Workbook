# Sessão A — Parte II do Workbook: Playbook D01–D23 (contrato único) + Interface Contract.
# Somente identidade (ref) e entregáveis (refs aos documentos) são preenchidos; o resto é TBD até haver fonte.
contracts:
  playbook_contract:
    id: CTR-PLAYBOOK
    order:
    - identidade
    - missao
    - objetivo
    - escopo
    - stakeholders
    - entradas
    - processos
    - saidas
    - entregaveis
    - produtos_servicos
    - dados
    - sistemas
    - dependencias
    - kpis
    - riscos
    - governanca
    - planejamento
    - capacidade
    - financeiro
    - evidencias
    - status
    source_refs:
    - SRC-01
    - SRC-02
    field_shapes:
      escopo:
        inclui: []
        exclui: []
      dados:
        produz: []
        consome: []
        fonte_da_verdade: TBD
      dependencias:
        depends_on: []
        blocks: []
      kpis:
        kpi: []
        metas: []
      governanca:
        decisoes: []
        aprovacoes: []
        gates: []
      planejamento:
        roadmap: TBD
        backlog: TBD
        sprint_atual: TBD
      capacidade:
        pessoas: TBD
        horas: TBD
        recursos: TBD
      financeiro:
        capex: TBD
        opex: TBD
    table_shapes_src04:
      processos:
      - processo
      - entrada
      - atividades_principais
      - saida
      - responsavel
      - evidencia
      entregaveis:
      - entrega
      - destinatario
      - frequencia
      - criterio_de_aceite
      - situacao
      responsabilidades:
      - papel
      - responsabilidade
      - autoridade
      kpis:
      - indicador
      - objetivo_relacionado
      - medida
      - meta
      - frequencia
      - fonte
      riscos:
      - risco
      - impacto
      - controle_atual
      - acao_necessaria
  interface_contract:
    id: CTR-INTERFACE
    order:
    - recebe
    - de
    - processa
    - produz
    - entrega_para
    - gate
    - sistema_de_registro
    - evidencia
    - sla
    - owner
    source_refs:
    - SRC-01
    - SRC-02
    - SRC-04
    allowed_values:
      recebe:
      - dado
      - documento
      - decisao
      - ativo
      - solicitacao
      de: Axx|Dxx|Mxx
      entrega_para: Axx|Dxx|Mxx
      sistema_de_registro:
      - Drive
      - GitHub
      - banco
      - ferramenta
      evidencia:
      - URL
      - arquivo
      - registro
      - commit
    pairwise_interface_src04:
    - origem
    - destino
    - recebe
    - processa
    - entrega
    - criterio_de_aceite
    - prazo
    - registro
    - evidencia
