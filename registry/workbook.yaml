# Raiz canônica do Master Schema EXECUTAR. Sessão A = o que o sistema é e conhece. Sessão B = como executa.
schema_version: 1.1.0
metadata:
  id: GOV-WORKBOOK-001
  name: Sistema Integrado de Governança e Operação EXECUTAR
  language: pt-BR
  status: proposed
  updated_at: '2026-09-27'

agent_contract:
  read_order:
    - AGENTS.md
    - docs/AI_AGENT_PROTOCOL.md
    - docs/ARCHITECTURE.md
    - docs/ID_CONVENTIONS.md
    - docs/NAVIGATION.md
    - schema/workbook.schema.yaml
    - registry/workbook.yaml
    - registry/session_a/master_index.yaml
  required_flow: sync -> inspect -> change -> validate -> commit -> sync
  invariants:
    - IDs publicados são estáveis e nunca são reutilizados.
    - Macroáreas e domínios representam capacidades permanentes.
    - Produtos e iniciativas consomem capacidades por referência.
    - Toda referência aponta para um ID existente.
    - Conteúdo sem aprovação permanece com status proposed.
    - Sessão A define o que o sistema é e conhece; Sessão B define como executa.
    - Objetos da Sessão B referenciam IDs da Sessão A em refs_a e nunca duplicam conhecimento canônico.
    - Lacuna factual é TBD; nada é inventado.
    - Aprovação é ato humano; PRE_PREENCHIDO nunca vira APROVADO por agente.

includes:
  session_a:
    master_index: registry/session_a/master_index.yaml
    architecture: registry/session_a/architecture.yaml
    domain_contracts: registry/session_a/domain_contracts.yaml
    documents: registry/session_a/documents.yaml
    portfolio: registry/session_a/portfolio.yaml
    governance: registry/session_a/governance.yaml
    workbook_manual: registry/session_a/workbook_manual.yaml
    pm_lifecycle: registry/session_a/pm_lifecycle.yaml
  session_b:
    foundation: registry/session_b/foundation.yaml
    execution_flow: registry/session_b/execution_flow.yaml
    objects: registry/session_b/objects.yaml

id_conventions:   # regex canônica; explicação em docs/ID_CONVENTIONS.md
  session_a:
    section: '^SA-[0-9]{2}$'
    macro_area: '^A[0-9]{2}$'
    domain: '^D[0-9]{2}$'
    subdomain: '^D[0-9]{2}\.SD[0-9]{2}$'
    process: '^D[0-9]{2}-PRC-[0-9]{3}$'
    deliverable: '^D[0-9]{2}-E[0-9]{2}$'
    document: '^D[0-9]{2}-DOC-[A-Z]{2,5}-[0-9]{3}$'
    field: '^D[0-9]{2}-DOC-[A-Z]{2,5}-[0-9]{3}\.[a-z_]+\.[a-z_]+$'
    program: '^P[0-9]{2}$'
    initiative: '^M[0-9]+(\.[0-9]+)?$'
    gate: '^G(0[0-9]|1[01])$'
    pm_phase: '^PM(0[1-9]|1[0-3])$'
    source: '^SRC-[0-9]{2}$'
    decision: '^DEC-[0-9]{3}$'
    gap: '^GAP-[0-9]{3}$'
    conflict: '^CNF-[0-9]{3}$'
    adr: '^ADR-[0-9]{3}$'
    requirement: '^REQ-[0-9]{3}$'
    workbook_part: '^WB-(P[1-3](-[0-9]{2})?|H[0-9]{2})$'
    contract: '^CTR-[A-Z]+$'
    level: '^L[0-6]$'
  session_b:
    foundation: '^SB-(0[0-9]|1[01])$'
    object: see registry/session_b/objects.yaml#object_types
