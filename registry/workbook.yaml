    - AGENTS.md
    - docs/AI_AGENT_PROTOCOL.md
    - schema/workbook.schema.yaml
    - registry/workbook.yaml
  required_flow: sync -> inspect -> change -> validate -> commit -> sync
  invariants:
    - IDs publicados são estáveis e nunca são reutilizados.
    - Macroáreas e domínios representam capacidades permanentes.
    - Produtos e iniciativas consomem capacidades por referência.
    - Toda referência aponta para um ID existente.
    - Conteúdo sem aprovação permanece com status proposed.

