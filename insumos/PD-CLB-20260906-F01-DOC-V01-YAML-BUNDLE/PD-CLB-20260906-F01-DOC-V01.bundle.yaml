  - {id: "T06", task: "Revisar estilo"}
  - {id: "T07", task: "Otimizar GEO/SEO"}
  - {id: "T08", task: "Roteiro vídeo mãe"}
  - {id: "T09", task: "Marcar fontes dos derivados"}
  - {id: "T10", task: "Banco de textos curtos"}
  - {id: "T11", task: "Roteiros vídeos verticais"}
  - {id: "T12", task: "Copy dos carrosséis"}
  - {id: "T13", task: "Copy imagens"}
  - {id: "T14", task: "Briefing infográficos"}
  - {id: "T15", task: "Stories"}
  - {id: "T16", task: "Newsletters"}
  - {id: "T17", task: "Ebooks"}
  - {id: "T18", task: "Mapear CTAs"}
  - {id: "T19", task: "Validar arco temático"}
  - {id: "T20", task: "Indexar arquivos"}
