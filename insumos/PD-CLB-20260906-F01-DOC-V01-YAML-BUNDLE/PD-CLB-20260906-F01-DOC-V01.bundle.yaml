  naming:
    pattern: "[HUB]-[PILAR]-[AAAAMMDD]-[SEQ]-[TIPO]-V[VERSAO]__[SLUG]"
    asset_types:
      ART: "Artigo"
      VID: "Vídeo"
      CRS: "Carrossel"
      IMG: "Imagem"
      INF: "Infográfico"
      STR: "Stories"
      NWL: "Newsletter"
      EBK: "Ebook"
      DOC: "Documento"
  folders:
    "01_PLANEJAMENTO": "Tema, Topic Pack e briefing"
    "02_PESQUISA-EVIDENCIAS": "Fontes e estudos"
    "03_PECA-MAE": "Artigo e vídeo mãe"
