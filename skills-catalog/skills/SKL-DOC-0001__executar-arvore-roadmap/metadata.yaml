  purpose:
    problem:
      statement: Converte planejamentos, roadmaps, sprints e cronogramas longos e desestruturados (planilhas, PDFs, documentos de metodologia, ou até uma simples descrição de projeto) em uma árvore de navegação
        hierárquica — mês → semana → dia → ciclo → tarefa → dependência → porta → evidência. Use sempre que o usuário pedir para transformar um plano em "árvore", "diretório navegável", "roadmap em texto",
        "cronograma em árvore", quando mencionar IDs desta skill (ARVORE-TXT-01, ARVORE-ZIP-02, ARVORE-OBSIDIAN-03, ARVORE-CSV-04, ARVOREKIT), quando pedir um vault Obsidian de mergulho progressivo para
        um plano operacional, ou quando pedir para converter um plano inteiro em CSV estruturado. Também dispare quando o usuário descrever um projeto do zero (sem plano pronto) e pedir para gerar o kit
        completo de planejamento em formato de árvore. Acionada também pelo ID verbal CV-ARVORE-001 (/arvore) do plugin executar-cop.
