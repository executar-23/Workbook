      - locator: SRC-ADM-20260821:t:3:r:1
        row_index: 1
        cells:
        - GP-01
        - 'Iniciação e escopo: necessidades, riscos, restrições, viabilidade'
        - Definir problema, objetivo, limites e critérios
        - Manter múltiplas variáveis; abstrair estado futuro; decidir
        - Organização/planejamento podem ser frágeis; grandes tarefas podem gerar procrastinação
        - NIMH relata desorganização, planejamento deficiente e dificuldade com grandes projetos. (NIMH)
        - Meta-análise em TDAH adulto encontra diferenças moderadas em medidas executivas. (PubMed)
        - Planejamento · memória de trabalho · controle executivo
        - C · moderada/forte
        - Definição do projeto
        - Muitas decisões simultâneas → sobrecarga → escopo incompleto ou início postergado
        - Brief guiado; progressive disclosure; restrições externalizadas; uma decisão por etapa
        - O sistema deve estruturar o projeto antes de pedir ao usuário que o gerencie. E · Inferido
      - locator: SRC-ADM-20260821:t:3:r:2
        row_index: 2
        cells:
        - GP-02
        - 'Planejamento: plano de ação, responsáveis, prazos, cronograma'
        - Converter objetivo em trabalho executável
        - Sequenciar, decompor, organizar, prever dependências
        - Dificuldades de planejamento/organização
        - NIMH inclui má gestão de tempo, planejamento e organização entre dificuldades funcionais possíveis. (NIMH)
        - Boonstra et al.; Pievsky & McGrath sintetizam alterações neurocognitivas/executivas em TDAH. (PubMed)
        - Planejamento · working memory · organização
        - C · forte para associação; não universal
        - Formação do plano
        - Objetivo macro exige muitas transformações mentais → plano incompleto ou pouco executável
        - Projeto → entregável → tarefa → ação atômica, dependências calculadas
        - Decomposição deve ser função do motor, não trabalho cognitivo repetido do usuário. E
      - locator: SRC-ADM-20260821:t:3:r:3
        row_index: 3
        cells:
        - GP-03
        - Priorizar e sequenciar
        - Garantir aderência a metas; determinar ordem de ação
        - Comparar valor, urgência, dependências e custo
        - Priorização/organização podem ser prejudicadas; não é um critério diagnóstico isolado
        - Revisões clínicas descrevem dificuldade de auto-organização, priorização e início; NIMH recomenda trabalhar organização
          e tarefas sensíveis ao tempo. (PubMed Central (PMC))
        - Modelos de EF em TDAH associam comportamento dirigido a metas à autorregulação executiva. (PubMed)
        - Goal management · inibição · planejamento
        - C · moderada
        - Escolha do próximo trabalho
        - Reavaliar continuamente alternativas → custo decisório → seleção instável/adiamento
        - Motor de prioridade usando dependência, critical path, prazo, bloqueio e valor + override humano
        - 'Não oferecer apenas uma lista: oferecer “próxima ação recomendada + por quê”. E'
      - locator: SRC-ADM-20260821:t:3:r:4
        row_index: 4
        cells:
        - GP-04
        - Cronograma e prazos
        - Apoiar cumprimento de prazos e sincronizar atividades
        - Estimar duração; perceber passagem do tempo; lembrar eventos futuros
        - Má gestão de tempo é clinicamente descrita; percepção temporal mostra resultados heterogêneos
        - NIMH cita explicitamente gestão de tempo deficiente e dificuldade com compromissos. (NIMH)
        - Revisão de percepção temporal em adultos conclui que há evidência relevante, mas não sustenta um déficit temporal
          universal. (PubMed Central (PMC))
        - Organização temporal · memória prospectiva
        - C · moderada / heterogênea
        - Schedule
        - Dependência de estimativa intuitiva → atraso, compressão do prazo, planejamento otimista
        - Tempo externalizado; marcos visíveis; buffers; dados históricos; previsão probabilística
        - Tempo deve ser observado pelo sistema, não presumido pelo usuário. E
      - locator: SRC-ADM-20260821:t:3:r:5
        row_index: 5
        cells:
        - GP-05
        - Iniciar execução
        - Colocar o plano em movimento
        - Transição intenção → ação; selecionar primeiro comportamento; reduzir ambiguidade
        - Procrastinação e dificuldade de iniciar tarefas aparecem clinicamente
        - NIMH registra procrastinação; literatura clínica adulta descreve dificuldade de começar tarefas. (NIMH)
        - Estudos de memória prospectiva mostram que adultos com TDAH podem ter dificuldade para planejar e executar intenções
          futuras. (PubMed)
        - Ativação dirigida a objetivo · planejamento prospectivo
        - C · moderada
        - Start
        - Tarefa abstrata/grande → alto custo de ativação → não iniciar
        - Mostrar somente primeira ação concreta; critérios de conclusão explícitos; botão iniciar imediato
        - A unidade de interface deve começar executável, não apenas informativa. E
      - locator: SRC-ADM-20260821:t:3:r:6
        row_index: 6
        cells:
        - GP-06
        - Execução
        - Produzir entregas conforme plano e prazo
        - Atenção sustentada; persistência; inibição de distrações; memória operacional
        - Distratibilidade, dificuldade em manter-se na tarefa e terminar projetos
        - 'NIMH: dificuldade de atenção, distração, manutenção da tarefa e conclusão. (NIMH)'
        - Estudos experimentais em adultos encontram prejuízo em atenção sustentada e deterioração relacionada ao tempo-na-tarefa.
          (PubMed)
        - Atenção sustentada · inibição
        - B/C · forte
        - Trabalho em andamento
        - Competição entre estímulos + duração → abandono, fragmentação ou múltiplos trabalhos parcialmente abertos
        - Modo foco, WIP baixo, fila separada, captura de interrupções sem abandonar tarefa atual
        - 1 ação dominante + queue secundária é uma arquitetura coerente com a evidência. E
      - locator: SRC-ADM-20260821:t:3:r:7
        row_index: 7
        cells:
        - GP-07
        - Monitorar execução e progresso
        - Acompanhar status, entregas, prazo e indicadores
        - Lembrar intenções; comparar estado atual × objetivo; autocontrole
        - Esquecimento de tarefas + dificuldades de memória prospectiva
        - NIMH cita dificuldade em lembrar tarefas diárias. (NIMH)
        - Fuermaier et al. observaram comprometimento em memória prospectiva complexa, especialmente ligado ao planejamento.
          (PubMed)
        - Memória prospectiva · working memory
        - B/C · moderada/forte
        - Controle de estado
        - Estado existe apenas “na cabeça” → intenção desaparece → trabalho fica incompleto
        - Status persistente; progresso automático; lembretes vinculados ao objeto; critérios DoD
        - O sistema deve ser memória externa do estado operacional. E
