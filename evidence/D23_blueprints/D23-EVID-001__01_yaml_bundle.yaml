    - locator: SRC-ADM-20260821:p:49
      paragraph_index: 49
      text: ⸻
    - locator: SRC-ADM-20260821:p:50
      paragraph_index: 50
      text: 'ID DATA-ADHD-PM-001

        Tipo Pesquisa · Matriz de evidências e implicações de produto

        Owner Não determinado

        Versão 1.0

        Data 19/08/2026

        Fase Síntese e correlação

        Projeto Não determinado

        PARA Produto · Arquitetura neuroinclusiva baseada em evidências

        Referência JSON AEVO · HOJE > Preencher(1).md · PMBOK® Guide 8 · NIMH · NICE · literatura científica

        3# #TDAH #gestaodeprojetos #neurodesign'
    - locator: SRC-ADM-20260821:p:51
      paragraph_index: 51
      text: ⸻
    - locator: SRC-ADM-20260821:p:52
      paragraph_index: 52
      text: RESUMO EXECUTIVO
    - locator: SRC-ADM-20260821:p:53
      paragraph_index: 53
      text: 'O quê Matriz paralela Gestão de Projetos → exigência humana → vulnerabilidade associada ao TDAH → impacto operacional
        → compensação sistêmica → decisão de produto.

        Por quê Testar a tese de que parte da carga normalmente deixada para o usuário pode ser deslocada para arquitetura,
        regras e automação do sistema.

        Quem Adultos com TDAH executando trabalho intelectual/projetos; produto, design e engenharia que constroem o sistema.

        Como Funções de projeto extraídas do documento-base e confrontadas com PMI, NIMH/NICE e estudos sobre funções executivas
        em TDAH adulto.'
    - locator: SRC-ADM-20260821:p:54
      paragraph_index: 54
      text: ⸻
    - locator: SRC-ADM-20260821:p:55
      paragraph_index: 55
      text: 3P+N · APLICAÇÃO
    - locator: SRC-ADM-20260821:p:56
      paragraph_index: 56
      text: 'Problema A gestão de projetos pressupõe diversas operações cognitivas — planejar, organizar, priorizar, lembrar,
        acompanhar, estimar tempo, iniciar e concluir — justamente em domínios nos quais adultos com TDAH podem, com grande
        heterogeneidade individual, apresentar dificuldades.

        Processo Decompor cada função operacional e procurar correspondência clínica e neuropsicológica, evitando transformar
        associação em causalidade universal.

        Progresso A hipótese central é parcialmente sustentada: há convergência forte para organização, planejamento, gestão
        temporal, atenção sustentada e conclusão; evidência moderada para memória prospectiva, flexibilidade e metacognição.

        Next 01 Transformar a matriz abaixo em requisitos funcionais e princípios de design verificáveis.

        Next 02 Separar evidência clínica de decisão de arquitetura, mantendo cada feature como hipótese testável.'
    - locator: SRC-ADM-20260821:p:58
      paragraph_index: 58
      text: ACHADO CENTRAL
    - locator: SRC-ADM-20260821:p:59
      paragraph_index: 59
      text: 'Seu documento-base formula exatamente a hipótese a ser testada: se priorização, iniciação, memória de trabalho,
        controle temporal, planejamento de longo prazo, troca de contexto e percepção da própria capacidade criarem atrito,
        o sistema deveria absorver parte dessas operações.'
    - locator: SRC-ADM-20260821:p:60
      paragraph_index: 60
      text: A literatura permite sustentar boa parte dessa direção, mas não permite declarar que toda pessoa com TDAH possui
        todos esses déficits. O NIMH descreve em adultos dificuldades possíveis com organização, procrastinação, planejamento,
        gestão de tempo, lembrança de tarefas, manutenção de foco e conclusão de grandes projetos. Meta-análises encontram
        diferenças de função executiva entre grupos com e sem TDAH, mas também mostram heterogeneidade substancial; portanto,
        TDAH ≠ déficit executivo global obrigatório.
    - locator: SRC-ADM-20260821:p:61
      paragraph_index: 61
      text: Do lado da gestão de projetos, seu JSON já estrutura iniciação/escopo → planejamento → execução → monitoramento/finalização.
        Isso é compatível com a organização tradicional dos processos de gestão e, na edição atual, o PMBOK® Guide 8 também
        enfatiza domínios como governança, escopo, cronograma, stakeholders, recursos e risco.
    - locator: SRC-ADM-20260821:p:63
      paragraph_index: 63
      text: 'A conclusão mais defensável não é:'
    - locator: SRC-ADM-20260821:p:64
      paragraph_index: 64
      text: “Pessoas com TDAH não conseguem gerir projetos.”
    - locator: SRC-ADM-20260821:p:66
      paragraph_index: 66
      text: A gestão convencional de projetos transfere ao operador humano uma quantidade relevante de funções de planejamento,
        organização, memória prospectiva, atenção, gestão temporal e autocontrole. Alguns desses mesmos domínios apresentam
        vulnerabilidades estatisticamente documentadas em adultos com TDAH. Portanto, existe fundamento para investigar uma
        arquitetura de gestão que externalize e automatize parte dessas operações, preservando decisão e autonomia do usuário.
    - locator: SRC-ADM-20260821:p:68
      paragraph_index: 68
      text: O NICE inclusive reconhece modificações ambientais como parte relevante da redução do impacto funcional do TDAH
        e menciona exemplos como reduzir períodos contínuos de foco e reforçar informação verbal com informação escrita. Isso
        não valida diretamente essas features digitais, mas fortalece o princípio de que o ambiente pode ser configurado para
        reduzir demandas desnecessárias sobre o indivíduo.
    - locator: SRC-ADM-20260821:p:69
      paragraph_index: 69
      text: 'Portanto, o seu conceito de neurodesign não deveria ser “simplificar uma UI para TDAH”. A formulação tecnicamente
        mais relevante é:'
    - locator: SRC-ADM-20260821:p:70
      paragraph_index: 70
      text: transferir carga executiva evitável do operador para o sistema.
    - locator: SRC-ADM-20260821:p:71
      paragraph_index: 71
      text: 'E isso encaixa diretamente na arquitetura do documento-base: cadeia única de objetos e dependências, decomposição
        até ação observável, estado persistente, redução de alternâncias e capacidade inferida a partir da execução real,
        não da expectativa subjetiva.'
    - locator: SRC-ADM-20260821:p:74
      paragraph_index: 74
      text: O usuário executa. O sistema sustenta a execução.
    - locator: SRC-ADM-20260821:p:77
      paragraph_index: 77
      text: SUA TESE, AGORA COM CORREÇÕES EPISTÊMICAS
    - locator: SRC-ADM-20260821:p:78
      paragraph_index: 78
      text: 'Seu documento propõe:'
    - locator: SRC-ADM-20260821:p:79
      paragraph_index: 79
      text: 'priorização → sistema prioriza;

        memória de trabalho → reduzir variáveis;

        inicialização → reduzir complexidade;

        tempo → flexibilizar;

        planejamento de longo prazo → ciclos;

        troca de contexto → agrupar;

        centralização → reduzir dispersão.'
