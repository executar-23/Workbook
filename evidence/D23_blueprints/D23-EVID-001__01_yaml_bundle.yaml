      paragraph_index: 112
      text: MAIOR FRAÇÃO DA CAPACIDADE COGNITIVA
    - locator: SRC-PMI-TDHA-EVID-20260821:p:113
      paragraph_index: 113
      text: DISPONÍVEL PARA EXECUÇÃO
    - locator: SRC-PMI-TDHA-EVID-20260821:p:114
      paragraph_index: 114
      text: A última seta é E · hipótese de produto. Ainda precisa ser testada empiricamente; a literatura não permite, neste
        estágio, afirmar que seu sistema necessariamente “liberará X% de capacidade cognitiva”.
    - locator: SRC-PMI-TDHA-EVID-20260821:p:116
      paragraph_index: 116
      text: 4. SUA TESE, AGORA COM CORREÇÕES EPISTÊMICAS
    - locator: SRC-PMI-TDHA-EVID-20260821:p:117
      paragraph_index: 117
      text: 'Seu documento propõe:'
    - locator: SRC-PMI-TDHA-EVID-20260821:p:118
      paragraph_index: 118
      text: 'priorização → sistema prioriza;

        memória de trabalho → reduzir variáveis;

        inicialização → reduzir complexidade;

        tempo → flexibilizar;

        planejamento de longo prazo → ciclos;

        troca de contexto → agrupar;

        centralização → reduzir dispersão.'
    - locator: SRC-PMI-TDHA-EVID-20260821:p:119
      paragraph_index: 119
      text: 'Depois da pesquisa, eu classificaria assim:'
    - locator: SRC-PMI-TDHA-EVID-20260821:p:120
      paragraph_index: 120
      text: Essa separação é importante porque seu próprio documento já propõe não confundir horas disponíveis com capacidade
        produtiva e calibrar throughput/cycle time por execução observada. Ele também corretamente separa EB = ação de Q30
        = capacidade temporal, deixando a duração real como variável observada.
    - locator: SRC-PMI-TDHA-EVID-20260821:p:122
      paragraph_index: 122
      text: 5. CONCLUSÃO DE PRODUTO / DESIGN
    - locator: SRC-PMI-TDHA-EVID-20260821:p:123
      paragraph_index: 123
      text: 'A conclusão mais defensável não é:'
    - locator: SRC-PMI-TDHA-EVID-20260821:p:124
      paragraph_index: 124
      text: “Pessoas com TDAH não conseguem gerir projetos.”
    - locator: SRC-PMI-TDHA-EVID-20260821:p:125
      paragraph_index: 125
      text: 'É:'
    - locator: SRC-PMI-TDHA-EVID-20260821:p:126
      paragraph_index: 126
      text: A gestão convencional de projetos transfere ao operador humano uma quantidade relevante de funções de planejamento,
        organização, memória prospectiva, atenção, gestão temporal e autocontrole. Alguns desses mesmos domínios apresentam
        vulnerabilidades estatisticamente documentadas em adultos com TDAH. Portanto, existe fundamento para investigar uma
        arquitetura de gestão que externalize e automatize parte dessas operações, preservando decisão e autonomia do usuário.
    - locator: SRC-PMI-TDHA-EVID-20260821:p:127
      paragraph_index: 127
      text: Isso é muito mais forte cientificamente.
    - locator: SRC-PMI-TDHA-EVID-20260821:p:128
      paragraph_index: 128
      text: 'E gera uma tese arquitetural:'
    - locator: SRC-PMI-TDHA-EVID-20260821:p:129
      paragraph_index: 129
      text: O usuário executa. O sistema sustenta a execução.
    - locator: SRC-PMI-TDHA-EVID-20260821:p:130
      paragraph_index: 130
      text: O NICE inclusive reconhece modificações ambientais como parte relevante da redução do impacto funcional do TDAH
        e menciona exemplos como reduzir períodos contínuos de foco e reforçar informação verbal com informação escrita. Isso
        não valida diretamente essas features digitais, mas fortalece o princípio de que o ambiente pode ser configurado para
        reduzir demandas desnecessárias sobre o indivíduo. (Nice)
    - locator: SRC-PMI-TDHA-EVID-20260821:p:131
      paragraph_index: 131
      text: 'Portanto, o seu conceito de neurodesign não deveria ser “simplificar uma UI para TDAH”. A formulação tecnicamente
        mais relevante é:'
    - locator: SRC-PMI-TDHA-EVID-20260821:p:132
      paragraph_index: 132
      text: transferir carga executiva evitável do operador para o sistema.
    - locator: SRC-PMI-TDHA-EVID-20260821:p:133
      paragraph_index: 133
      text: 'E isso encaixa diretamente na arquitetura do documento-base: cadeia única de objetos e dependências, decomposição
        até ação observável, estado persistente, redução de alternâncias e capacidade inferida a partir da execução real,
        não da expectativa subjetiva.'
    - locator: SRC-PMI-TDHA-EVID-20260821:p:134
      paragraph_index: 134
      text: Classificação final
    - locator: SRC-PMI-TDHA-EVID-20260821:p:135
      paragraph_index: 135
      text: 'C · Publicado: existe sobreposição relevante entre demandas cognitivas da gestão de projetos e domínios em que
        adultos com TDAH podem apresentar dificuldades. (NIMH)'
    - locator: SRC-PMI-TDHA-EVID-20260821:p:136
      paragraph_index: 136
      text: 'E · Inferido: um sistema que absorva planejamento repetitivo, memória operacional externa, priorização, controle
        de estado e forecasting pode reduzir fricção operacional.'
    - locator: SRC-PMI-TDHA-EVID-20260821:p:137
      paragraph_index: 137
      text: 'Ainda não verificado: que essa arquitetura produza aumento mensurável de execução, conclusão ou produtividade
        em usuários com TDAH. Esse é precisamente o claim que o produto deverá testar.'
