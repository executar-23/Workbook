        - Má gestão de tempo é clinicamente descrita; percepção temporal mostra resultados heterogêneos
        - NIMH cita explicitamente gestão de tempo deficiente e dificuldade com compromissos. (NIMH)
        - Revisão de percepção temporal em adultos conclui que há evidência relevante, mas não sustenta um déficit temporal
