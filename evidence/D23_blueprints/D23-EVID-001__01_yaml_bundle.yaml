        - Start
        - Tarefa abstrata/grande → alto custo de ativação → não iniciar
        - Mostrar somente primeira ação concreta; critérios de conclusão explícitos; botão iniciar imediato
        - A unidade de interface deve começar executável, não apenas informativa. E
      - locator: SRC-PMI-TDHA-EVID-20260821:t:0:r:6
        row_index: 6
        cells:
        - GP-06
        - Execução
        - Produzir entregas conforme plano e prazo
        - Atenção sustentada; persistência; inibição de distrações; memória operacional
        - Distratibilidade, dificuldade em manter-se na tarefa e terminar projetos
        - 'NIMH: dificuldade de atenção, distração, manutenção da tarefa e conclusão. (NIMH)'
        - Estudos experimentais em adultos encontram prejuízo em atenção sustentada e deterioração relacionada ao tempo-na-tarefa.
          (PubMed)
        - Atenção sustentada · inibição
        - B/C · forte
        - Trabalho em andamento
        - Competição entre estímulos + duração → abandono, fragmentação ou múltiplos trabalhos parcialmente abertos
        - Modo foco, WIP baixo, fila separada, captura de interrupções sem abandonar tarefa atual
        - 1 ação dominante + queue secundária é uma arquitetura coerente com a evidência. E
      - locator: SRC-PMI-TDHA-EVID-20260821:t:0:r:7
        row_index: 7
        cells:
        - GP-07
        - Monitorar execução e progresso
        - Acompanhar status, entregas, prazo e indicadores
        - Lembrar intenções; comparar estado atual × objetivo; autocontrole
        - Esquecimento de tarefas + dificuldades de memória prospectiva
        - NIMH cita dificuldade em lembrar tarefas diárias. (NIMH)
        - Fuermaier et al. observaram comprometimento em memória prospectiva complexa, especialmente ligado ao planejamento.
          (PubMed)
        - Memória prospectiva · working memory
        - B/C · moderada/forte
        - Controle de estado
        - Estado existe apenas “na cabeça” → intenção desaparece → trabalho fica incompleto
        - Status persistente; progresso automático; lembretes vinculados ao objeto; critérios DoD
        - O sistema deve ser memória externa do estado operacional. E
      - locator: SRC-PMI-TDHA-EVID-20260821:t:0:r:8
        row_index: 8
        cells:
        - GP-08
        - Detectar desvios e adaptar
        - Criar alternativas e responder a imprevistos
        - Flexibilidade cognitiva; alternar conjunto mental sem perder objetivo
        - Evidência de dificuldade de set-shifting existe, mas é menos uniforme que atenção/organização
        - Não é um sintoma clínico específico isolado em NIMH/NICE; deve ser tratado como domínio neuropsicológico, não característica
          obrigatória
        - Estudos em adultos encontraram dificuldades específicas de set-shifting; resultados na literatura permanecem heterogêneos.
          (PubMed)
        - Flexibilidade cognitiva · set shifting
        - B/C · moderada
        - Replanejamento
        - Mudança inesperada exige reconstrução mental do plano → perda de contexto/dependências
        - Branches pré-calculados; alternativas limitadas; dependências preservadas; retorno ao ponto anterior
        - Permitir não-linearidade controlada, não navegação caótica. E
      - locator: SRC-PMI-TDHA-EVID-20260821:t:0:r:9
        row_index: 9
        cells:
        - GP-09
        - Comunicação e stakeholders
        - Manter partes alinhadas, registrar decisões e follow-up
        - Atenção, memória prospectiva, inibição, recuperação contextual
        - Esquecimento, distração e impulsividade podem interferir na continuidade comunicacional
        - NIMH inclui esquecimento, distração e interrupção/impulsividade entre manifestações possíveis. (NIMH)
        - Evidência de memória prospectiva e controle executivo oferece mecanismo plausível. (PubMed)
        - Memória prospectiva · inibição · atenção
        - C + E para efeito específico em PM
        - Follow-up
        - Informação espalhada → necessidade de reconstrução de contexto → decisões e compromissos perdidos
        - Comunicação associada ao objeto; resumos; decisões persistidas; follow-up convertido em ação
        - Centralizar contexto é mais importante que simplesmente adicionar chat. E
      - locator: SRC-PMI-TDHA-EVID-20260821:t:0:r:10
        row_index: 10
        cells:
        - GP-10
        - Finalização e avaliação
        - Confirmar entrega, comparar objetivo × resultado, retrospectiva
        - Fechamento, autocontrole, avaliação do próprio desempenho
        - Dificuldade em finalizar projetos + potenciais diferenças metacognitivas
        - NIMH descreve dificuldade em terminar projetos. (NIMH)
        - Estudo de metacognição em adultos encontrou falta de correspondência entre avaliações subjetivas e objetivas em
          alguns domínios. (Springer)
        - Metacognição · self-monitoring
        - B/C · moderada
        - Closure
        - “Parece pronto” ≠ critério objetivo → fechamento inconsistente
        - DoD explícito; evidência anexada; validação; retrospectiva estruturada
        - DONE deve ser uma transição verificável, não uma sensação de conclusão. E
      - locator: SRC-PMI-TDHA-EVID-20260821:t:0:r:11
        row_index: 11
        cells:
        - GP-11
        - Capacidade e forecasting
        - Planejar recursos/prazo e proteger compromisso de entrega
        - Autoavaliação, previsão temporal e planejamento
        - Má gestão temporal é documentada; desalinhamento metacognitivo é possível, não universal
        - NIMH documenta problemas de planejamento/tempo; não afirma “incapacidade de estimar capacidade produtiva”. (NIMH)
        - Evidência de percepção temporal e metacognição sustenta cautela com estimativas subjetivas, mas não valida diretamente
          seu algoritmo. (PubMed Central (PMC))
        - Metacognição · previsão · temporalidade
        - C para vulnerabilidade; E para solução
        - Compromisso de capacidade
        - “horas livres” confundidas com output → excesso de compromisso
        - Throughput, cycle time e histórico individual; forecast probabilístico; EB separado de tempo
        - Sua arquitetura EB = ação, tempo = medida observada é defensável como decisão de operações, não como tratamento
          clínico. E
