      paragraph_index: 6
      text: 'O quê Matriz paralela Gestão de Projetos → exigência humana → vulnerabilidade associada ao TDAH → impacto operacional
        → compensação sistêmica → decisão de produto.

        Por quê Testar a tese de que parte da carga normalmente deixada para o usuário pode ser deslocada para arquitetura,
        regras e automação do sistema.

        Quem Adultos com TDAH executando trabalho intelectual/projetos; produto, design e engenharia que constroem o sistema.

        Como Funções de projeto extraídas do documento-base e confrontadas com PMI, NIMH/NICE e estudos sobre funções executivas
        em TDAH adulto.'
    - locator: SRC-PMI-TDHA-EVID-20260821:p:7
      paragraph_index: 7
