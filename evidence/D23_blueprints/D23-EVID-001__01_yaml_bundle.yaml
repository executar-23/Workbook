    - locator: SRC-PMI-TDHA-EVID-20260821:p:54
      paragraph_index: 54
      text: 1. ACHADO CENTRAL
    - locator: SRC-PMI-TDHA-EVID-20260821:p:55
      paragraph_index: 55
      text: 'Seu documento-base formula exatamente a hipótese a ser testada: se priorização, iniciação, memória de trabalho,
        controle temporal, planejamento de longo prazo, troca de contexto e percepção da própria capacidade criarem atrito,
        o sistema deveria absorver parte dessas operações.'
    - locator: SRC-PMI-TDHA-EVID-20260821:p:56
      paragraph_index: 56
      text: A literatura permite sustentar boa parte dessa direção, mas não permite declarar que toda pessoa com TDAH possui
        todos esses déficits. O NIMH descreve em adultos dificuldades possíveis com organização, procrastinação, planejamento,
        gestão de tempo, lembrança de tarefas, manutenção de foco e conclusão de grandes projetos. (NIMH) Meta-análises encontram
        diferenças de função executiva entre grupos com e sem TDAH, mas também mostram heterogeneidade substancial; portanto,
        TDAH ≠ déficit executivo global obrigatório. (PubMed)
    - locator: SRC-PMI-TDHA-EVID-20260821:p:57
      paragraph_index: 57
      text: Do lado da gestão de projetos, seu JSON já estrutura iniciação/escopo → planejamento → execução → monitoramento/finalização.
        Isso é compatível com a organização tradicional dos processos de gestão e, na edição atual, o PMBOK® Guide 8 também
        enfatiza domínios como governança, escopo, cronograma, stakeholders, recursos e risco. (Project Management Institute)
    - locator: SRC-PMI-TDHA-EVID-20260821:p:59
      paragraph_index: 59
      text: 2. MATRIZ TABULAR PRINCIPAL
    - locator: SRC-PMI-TDHA-EVID-20260821:p:61
