        - Dificuldades de planejamento/organização
        - NIMH inclui má gestão de tempo, planejamento e organização entre dificuldades funcionais possíveis. (NIMH)
        - Boonstra et al.; Pievsky & McGrath sintetizam alterações neurocognitivas/executivas em TDAH. (PubMed)
        - Planejamento · working memory · organização
        - C · forte para associação; não universal
