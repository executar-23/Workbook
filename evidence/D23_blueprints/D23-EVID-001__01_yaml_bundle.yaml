    - locator: SRC-ADM-20260821:p:239
      paragraph_index: 239
      text: cobrança e acompanhamento de resultados;
    - locator: SRC-ADM-20260821:p:240
      paragraph_index: 240
      text: planejamento de atividades;
    - locator: SRC-ADM-20260821:p:241
      paragraph_index: 241
      text: controle de execução;
    - locator: SRC-ADM-20260821:p:242
      paragraph_index: 242
      text: acompanhamento de indicadores;
    - locator: SRC-ADM-20260821:p:243
      paragraph_index: 243
      text: comunicação interna;
    - locator: SRC-ADM-20260821:p:244
      paragraph_index: 244
      text: treinamento;
    - locator: SRC-ADM-20260821:p:245
      paragraph_index: 245
      text: ajuste contínuo.
    - locator: SRC-ADM-20260821:p:246
      paragraph_index: 246
      text: Isso gera uma estrutura muito importante para sua análise.
    - locator: SRC-ADM-20260821:p:247
      paragraph_index: 247
      text: Funções executivas de uma área de gestão de projetos
    - locator: SRC-ADM-20260821:p:248
      paragraph_index: 248
      text: Há uma segunda camada muito relevante em SEC-004.
    - locator: SRC-ADM-20260821:p:249
      paragraph_index: 249
      text: A missão da área é descrita como garantir a realização dos projetos, principalmente aqueles estratégicos.
    - locator: SRC-ADM-20260821:p:250
