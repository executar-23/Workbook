      text: Funções fundamentais de gestão de projetos
    - locator: SRC-ADM-20260821:p:193
      paragraph_index: 193
      text: O JSON fornece uma estrutura especialmente útil em SEC-002, dividida em quatro grandes funções.
    - locator: SRC-ADM-20260821:p:194
      paragraph_index: 194
      text: GP-FUNC-01 · Iniciação e escopo
    - locator: SRC-ADM-20260821:p:195
      paragraph_index: 195
      text: 'Funções:'
    - locator: SRC-ADM-20260821:p:196
      paragraph_index: 196
      text: identificar necessidades;
    - locator: SRC-ADM-20260821:p:197
      paragraph_index: 197
      text: identificar riscos;
    - locator: SRC-ADM-20260821:p:198
      paragraph_index: 198
      text: identificar restrições;
    - locator: SRC-ADM-20260821:p:199
      paragraph_index: 199
      text: avaliar viabilidade;
    - locator: SRC-ADM-20260821:p:200
      paragraph_index: 200
      text: obter autorizações;
    - locator: SRC-ADM-20260821:p:201
      paragraph_index: 201
      text: definir limites iniciais do projeto.
    - locator: SRC-ADM-20260821:p:202
      paragraph_index: 202
      text: 'Resultado: definição inicial do projeto e de seu escopo.'
    - locator: SRC-ADM-20260821:p:203
      paragraph_index: 203
      text: GP-FUNC-02 · Planejamento
    - locator: SRC-ADM-20260821:p:204
      paragraph_index: 204
      text: 'Funções:'
    - locator: SRC-ADM-20260821:p:205
      paragraph_index: 205
      text: construir plano de ação;
    - locator: SRC-ADM-20260821:p:206
      paragraph_index: 206
      text: definir o que será feito;
    - locator: SRC-ADM-20260821:p:207
      paragraph_index: 207
      text: atribuir responsáveis;
    - locator: SRC-ADM-20260821:p:208
      paragraph_index: 208
      text: definir prazos;
    - locator: SRC-ADM-20260821:p:209
      paragraph_index: 209
      text: identificar validadores;
    - locator: SRC-ADM-20260821:p:210
      paragraph_index: 210
      text: montar cronograma.
    - locator: SRC-ADM-20260821:p:211
      paragraph_index: 211
      text: 'Resultado: plano operacional + cronograma.'
    - locator: SRC-ADM-20260821:p:212
      paragraph_index: 212
      text: GP-FUNC-03 · Execução
    - locator: SRC-ADM-20260821:p:213
      paragraph_index: 213
      text: 'Funções:'
    - locator: SRC-ADM-20260821:p:214
      paragraph_index: 214
      text: executar segundo o cronograma;
    - locator: SRC-ADM-20260821:p:215
      paragraph_index: 215
      text: seguir definições do planejamento;
    - locator: SRC-ADM-20260821:p:216
      paragraph_index: 216
      text: acompanhar responsabilidades;
    - locator: SRC-ADM-20260821:p:217
      paragraph_index: 217
      text: acompanhar entregas;
    - locator: SRC-ADM-20260821:p:218
      paragraph_index: 218
      text: acompanhar prazos;
    - locator: SRC-ADM-20260821:p:219
      paragraph_index: 219
      text: utilizar ferramentas de gestão.
    - locator: SRC-ADM-20260821:p:220
      paragraph_index: 220
      text: 'Resultado: entregas produzidas e projeto em andamento controlado.'
    - locator: SRC-ADM-20260821:p:221
      paragraph_index: 221
      text: GP-FUNC-04 · Monitoramento e finalização
    - locator: SRC-ADM-20260821:p:222
      paragraph_index: 222
      text: 'Funções:'
    - locator: SRC-ADM-20260821:p:223
      paragraph_index: 223
      text: monitorar a execução;
    - locator: SRC-ADM-20260821:p:224
      paragraph_index: 224
      text: detectar imprevistos;
    - locator: SRC-ADM-20260821:p:225
      paragraph_index: 225
      text: criar alternativas;
    - locator: SRC-ADM-20260821:p:226
      paragraph_index: 226
      text: evitar paralisações;
    - locator: SRC-ADM-20260821:p:227
      paragraph_index: 227
      text: avaliar resultados;
    - locator: SRC-ADM-20260821:p:228
      paragraph_index: 228
      text: comparar resultado × objetivo;
    - locator: SRC-ADM-20260821:p:229
      paragraph_index: 229
      text: realizar retrospectiva;
    - locator: SRC-ADM-20260821:p:230
      paragraph_index: 230
      text: registrar aprendizados.
    - locator: SRC-ADM-20260821:p:231
      paragraph_index: 231
      text: 'Resultado: projeto encerrado + resultados avaliados + aprendizado acumulado.'
    - locator: SRC-ADM-20260821:p:232
      paragraph_index: 232
      text: Capacidades humanas/operacionais exigidas
    - locator: SRC-ADM-20260821:p:233
      paragraph_index: 233
      text: O JSON não chama essas capacidades de “funções executivas cognitivas”, mas contém vários comportamentos necessários
        para executar projetos.
    - locator: SRC-ADM-20260821:p:234
      paragraph_index: 234
      text: 'Em SEC-005 aparecem:'
    - locator: SRC-ADM-20260821:p:235
      paragraph_index: 235
      text: criatividade;
    - locator: SRC-ADM-20260821:p:236
