        - GP-11
        - Capacidade e forecasting
        - Planejar recursos/prazo e proteger compromisso de entrega
        - Autoavaliação, previsão temporal e planejamento
        - Má gestão temporal é documentada; desalinhamento metacognitivo é possível, não universal
        - NIMH documenta problemas de planejamento/tempo; não afirma “incapacidade de estimar capacidade produtiva”. (NIMH)
