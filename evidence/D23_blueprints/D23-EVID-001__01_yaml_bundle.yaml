    - locator: SRC-PMI-TDHA-EVID-20260821:p:8
      paragraph_index: 8
      text: 3P+N · APLICAÇÃO
    - locator: SRC-PMI-TDHA-EVID-20260821:p:9
      paragraph_index: 9
      text: 'Problema A gestão de projetos pressupõe diversas operações cognitivas — planejar, organizar, priorizar, lembrar,
        acompanhar, estimar tempo, iniciar e concluir — justamente em domínios nos quais adultos com TDAH podem, com grande
        heterogeneidade individual, apresentar dificuldades.

        Processo Decompor cada função operacional e procurar correspondência clínica e neuropsicológica, evitando transformar
        associação em causalidade universal.

        Progresso A hipótese central é parcialmente sustentada: há convergência forte para organização, planejamento, gestão
        temporal, atenção sustentada e conclusão; evidência moderada para memória prospectiva, flexibilidade e metacognição.

        Next 01 Transformar a matriz abaixo em requisitos funcionais e princípios de design verificáveis.

        Next 02 Separar evidência clínica de decisão de arquitetura, mantendo cada feature como hipótese testável.'
