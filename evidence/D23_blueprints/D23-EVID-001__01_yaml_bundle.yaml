        - Priorização/organização podem ser prejudicadas; não é um critério diagnóstico isolado
        - Revisões clínicas descrevem dificuldade de auto-organização, priorização e início; NIMH recomenda trabalhar organização
          e tarefas sensíveis ao tempo. (PubMed Central (PMC))
        - Modelos de EF em TDAH associam comportamento dirigido a metas à autorregulação executiva. (PubMed)
        - Goal management · inibição · planejamento
